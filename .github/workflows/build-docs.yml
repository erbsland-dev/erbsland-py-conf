name: Docs
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    environment: release
    steps:
      # actions/checkout@v6.0.2
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      # actions/setup-python@v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6.2.0
      - name: Install Sphinx
        run: |
          pip install -r doc/requirements-doc.txt
      - name: Build documentation
        run: |
          sphinx-build doc _build
      - name: Set CNAME if in public repo
        id: cname
        run: |
          if [ "${{ github.repository }}" = "erbsland-dev/erbsland-py-conf" ]; then
            echo "CNAME=config-py.erbsland.dev" >> $GITHUB_ENV
          fi
      - name: Deploy
        # peaceiris/actions-gh-pages@v4.1.0
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.0.0
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        with:
          publish_branch: gh-pages
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: _build/
          force_orphan: true
          cname: ${{ env.CNAME }}
