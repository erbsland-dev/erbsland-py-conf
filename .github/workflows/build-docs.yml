name: Docs
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions: {}
jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-latest
    permissions:
      contents: read # Check out the documentation sources.
    steps:
      # actions/checkout@v6.0.2
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      # actions/setup-python@v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Install Sphinx
        run: |
          python -m pip install -r doc/requirements-doc.txt
      - name: Build documentation
        run: |
          sphinx-build -b html doc _build/html
      - name: Upload documentation
        # actions/upload-artifact@v7.0.2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: documentation
          path: _build/html/
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Deploy documentation
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write # Publish the generated documentation to the gh-pages branch.
    steps:
      - name: Download documentation
        # actions/download-artifact@v8.0.2
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: documentation
          path: _build/html/
      - name: Deploy
        # peaceiris/actions-gh-pages@v4.1.0
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          publish_branch: gh-pages
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: _build/html/
          force_orphan: true
          cname: ${{ github.repository == 'erbsland-dev/erbsland-py-conf' && 'config-py.erbsland.dev' || '' }}
