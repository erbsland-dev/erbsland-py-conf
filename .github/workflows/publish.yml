name: Publish to PyPI.org
on:
  release:
    types: [published]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
permissions: {}

jobs:
  pypi:
    name: Build and publish package
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write # Authenticate with PyPI through trusted publishing.
      contents: read # Check out the release sources and version tags.
    steps:
      - name: Checkout
        # actions/checkout@v6.0.2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        # actions/setup-python@v7.0.0
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - name: Install build backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install hatchling hatch-vcs build

      - name: Build Distribution
        run: python -m build

      - name: Publish package
        # pypa/gh-action-pypi-publish@v1.14.2
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
